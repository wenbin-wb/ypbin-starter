name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: 自动发布 Release
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 全量测试与构建校验
        run: mvn -B clean test

      - name: 提取版本号（去 v 前缀）
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 校验 pom revision 与 tag 一致
        run: |
          POM_VERSION=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive org.codehaus.mojo:exec-maven-plugin:3.1.0:exec)
          echo "pom=$POM_VERSION tag=${{ steps.version.outputs.VERSION }}"
          [ "$POM_VERSION" = "${{ steps.version.outputs.VERSION }}" ] || { echo "版本不一致，拒绝发布"; exit 1; }

      - name: 同步 README 快速开始 BOM 版本
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s|<version>[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*</version>|<version>${VERSION}</version>|g" README.md
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(release): 同步 README BOM 版本至 v${VERSION}" || echo "无变更需提交"
          # tag 触发的 checkout 处于 detached HEAD，push 必须显式指定 refspec
          git push origin HEAD:master

      - name: 提取 Release Notes 并发布 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: 通知下游同步版本（admin + site 的 sync-starter-version）
        # 跨仓库 dispatch 需对下游有写权限的 PAT（默认 GITHUB_TOKEN 仅限本仓库）。
        # 在 starter 仓库 Settings → Secrets 配 YPBIN_DISPATCH_TOKEN（对 wenbin-wb 全仓库有写权限的 PAT）。
        # 下游同步失败不阻塞本次发布，仅告警。
        continue-on-error: true
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TOKEN="${YPBIN_DISPATCH_TOKEN:-${{ secrets.YPBIN_DISPATCH_TOKEN }}}"
          if [ -z "$TOKEN" ]; then
            echo "未配置 YPBIN_DISPATCH_TOKEN，跳过下游同步（可手动在 admin/site 跑 workflow_dispatch）"
            exit 0
          fi
          for REPO in wenbin-wb/ypbin-admin wenbin-wb/ypbin-site; do
            curl -fsS -X POST "https://api.github.com/repos/${REPO}/dispatches" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "{\"event_type\":\"starter-release\",\"client_payload\":{\"version\":\"${VERSION}\"}}" \
              && echo "已通知 ${REPO} 同步 v${VERSION}" || echo "通知 ${REPO} 失败（忽略）"
          done
