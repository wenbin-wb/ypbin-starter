name: CodeQL

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 3 * * 1'  # 每周一 03:00 UTC 定时扫描

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL 静态安全扫描
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [ java-kotlin ]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: 构建（生成 CodeQL 数据库）
        run: mvn -B clean compile -DskipTests

      - name: 执行 CodeQL 分析
        uses: github/codeql-action/analyze@v3
