name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: 构建与校验
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 编译、代码风格校验与全量单元测试
        run: mvn -B clean test

      - name: 本地打包与安装
        run: mvn -B install -DskipTests

      - name: 配置 Node（配置元数据导出脚本依赖）
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 空值语义静态检查。@NullMarked 声明「未标注即非空」，NullAway 让漏标 @Nullable 直接变成编译失败。
      # 参与模块由 pom 里是否声明 nullaway.packages 决定，这里自动发现，新增模块无需改本文件；
      # 检查范围见站点「项目脚手架 → 空值语义」。注意加 --fail-at-end：否则快速失败会让
      # 后面模块「看起来通过」，实际是根本没跑到。
      - name: 空值语义检查（NullAway）
        run: |
          MODULES="$(
            for pom in ./*/pom.xml; do
              dir="$(dirname "$pom")"
              [ -d "$dir/src/main/java" ] || continue
              if grep -q '<nullaway.packages>' "$pom"; then printf '%s\n' "${dir#./}"; fi
            done | paste -sd, -
          )"
          if [ -z "$MODULES" ]; then
            echo "没有模块声明 nullaway.packages，跳过"
            exit 0
          fi
          echo "参与模块：$MODULES"
          # 必须 clean：Error Prone 只在 javac 真正执行时生效，若前置步骤已编译过同类，
          # Maven 会输出「Nothing to compile」直接跳过——门禁会静默变成空转（本仓库踩过）。
          # --fail-at-end：否则快速失败会让后续模块「看起来通过」，实际是根本没跑到。
          OUT="$(mvn -B -Pnullaway -pl "$MODULES" clean compile --fail-at-end 2>&1)" || {
            printf '%s\n' "$OUT" | grep -E "\[ERROR\]" | head -30
            exit 1
          }
          if printf '%s\n' "$OUT" | grep -q "Nothing to compile"; then
            echo "✖ 未发生实际编译，NullAway 等于空转（请检查是否遗漏 clean）"
            exit 1
          fi
          printf '%s\n' "$OUT" | grep -E "Compiling .* source file|BUILD SUCCESS" | tail -8

      # 依赖版本收敛：同一构件在依赖树里出现多个版本即失败。Maven 对「同深度不同版本」按声明顺序择一，
      # 结果不确定也无声；本仓库借此发现过 commons-io 与 victools jsonschema 两处真实分叉。
      - name: 依赖版本收敛检查
        run: mvn -B -Pdep-convergence validate --fail-at-end

      - name: 校验配置元数据未漂移
        run: node tools/export-config-metadata.mjs --check

      # 埋点事件目录是前后端共用的契约（docs/tracking-events.json 为事实源），
      # 手工改生成物或改目录后忘记重生成都必须在这里被拦下。
      - name: 校验埋点事件目录未漂移
        run: node tools/export-tracking-events.mjs --check

      - name: 生成 CycloneDX SBOM（软件物料清单）
        run: mvn -B -Psbom -DskipTests verify

      - name: 归档 SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: "**/target/bom.json"
          if-no-files-found: ignore

      - name: 归档 JaCoCo 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: "**/target/site/jacoco/"
          if-no-files-found: ignore

  integration-tests:
    name: 集成测试（Testcontainers）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 编译、代码风格校验与全量单元测试
        run: mvn -B clean test

      - name: 安装到本地仓库（供 IT 模块解析依赖）
        run: mvn -B install -DskipTests

      # GitHub 托管 runner 自带 Docker，IT 会真实拉起 Redis/MySQL 容器；
      # 若某模块的中间件不可用，对应 IT 会条件跳过而非失败（见 ypbin-starter-test）。
      - name: 执行集成测试（*IT.java）
        run: mvn -B -Pit verify -DskipTests=false
