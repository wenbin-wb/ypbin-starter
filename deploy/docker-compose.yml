# ypbin-starter 本地微服务自测环境
#
# 提供 Nacos（注册发现 + 配置中心）、Redis、MySQL，用于端到端验证服务注册、
# Feign 调用、网关路由、动态路由、缓存与限流等能力。
#
# 用法：
#   docker compose -f deploy/docker-compose.yml up -d
#   停止：docker compose -f deploy/docker-compose.yml down
#   连带数据卷清理：docker compose -f deploy/docker-compose.yml down -v
#
# 说明：仅用于本地开发自测，未做生产加固（弱口令、单机模式），请勿用于生产。

services:
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: ypbin-nacos
    environment:
      MODE: standalone
      # 单机模式默认用内嵌 Derby，无需外部数据库；如需持久化到 MySQL 可切换 spring.datasource
      PREFER_HOST_MODE: hostname
    ports:
      - "8848:8848"   # 控制台 / OpenAPI
      - "9848:9848"   # gRPC 客户端端口（2.x 必需）
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ypbin-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ypbin-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  sentinel-dashboard:
    # Sentinel Dashboard 阿里官方从不发布 Docker 镜像，官方只提供 GitHub Releases 的 jar。
    # 这里从官方 jar 自打包（来源完全透明，不依赖任何第三方镜像），构建期需能访问 github.com。
    build:
      context: ./sentinel-dashboard
    image: ypbin/sentinel-dashboard:1.8.8
    container_name: ypbin-sentinel-dashboard
    environment:
      # 控制台登录账号密码
      AUTH_USERNAME: sentinel
      AUTH_PASSWORD: sentinel
    ports:
      - "8858:8858"   # 控制台 UI；服务端通过 spring.cloud.sentinel.transport.dashboard=localhost:8858 上报
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8858/"]
      interval: 15s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: ypbin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: ypbin
    ports:
      - "3306:3306"
    volumes:
      - ypbin-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ypbin-redis-data:
  ypbin-mysql-data:
