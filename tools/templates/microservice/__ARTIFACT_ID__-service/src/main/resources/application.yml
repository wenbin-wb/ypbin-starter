server:
  port: __PORT__

spring:
  application:
    name: __ARTIFACT_ID__-service
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}

ypbin:
  json:
    date-time-format: yyyy-MM-dd HH:mm:ss
    write-big-number-as-string: true
  security:
    # 下游服务：登录态由网关校验并注入身份头，故关掉「登录态」校验；
    # 方法级注解鉴权（@SaCheckPermission 等）保持默认开启，账号来源为下面的身份头
    interceptor: false
    identity:
      # 仅在可信网关之后开启；若服务可被外部直连，请保持关闭或配置来源校验
      enabled: true
  cloud:
    feign:
      # 生产建议配置共享标记后开启，防止直连服务伪造身份头经 Feign 放大越权
      trusted-source-token: ${GATEWAY_SIGN_TOKEN:}
